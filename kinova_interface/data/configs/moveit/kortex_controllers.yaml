# Our copy of Kinova's gen3_lite/6dof ros2_controllers.yaml, loaded by launch/robot.launch.py.
# The only change: joint_trajectory_controller has goal tolerances. Kinova's has none, so a move
# "succeeded" when its time ran out even if the arm lagged, faulted or never moved.

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    twist_controller:
      type: picknik_twist_controller/PicknikTwistController

    fault_controller:
      type: picknik_reset_fault_controller/PicknikResetFaultController

    gen3_lite_2f_gripper_controller:
      type: position_controllers/GripperActionController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      # A move only succeeds once every joint is within `goal` rad, waiting up to goal_time s past its end
      goal_time: 1.0
      joint_1: {goal: 0.01}
      joint_2: {goal: 0.01}
      joint_3: {goal: 0.01}
      joint_4: {goal: 0.01}
      joint_5: {goal: 0.01}
      joint_6: {goal: 0.01}

twist_controller:
  ros__parameters:
    joint: tcp
    interface_names:
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z

gen3_lite_2f_gripper_controller:
  ros__parameters:
    default: true
    joint: right_finger_bottom_joint
    allow_stalling: true
