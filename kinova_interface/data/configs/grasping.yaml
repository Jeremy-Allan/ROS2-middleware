# Settings for object-aware pickup and dropoff. Distances in metres, angles as noted.
# Loaded once at startup, so restart after changing anything.

ik_timeout_sec: 0.1             # time limit per /compute_ik call; a failed call uses all of it
wrist_flip_threshold_rad: 1.5   # reject a grasp if any joint swings more than this between pre-grasp and grasp

yaw_step_deg: 30                # angle between cylinder grasps around its axis; bigger = fewer candidates, faster

standoff: 0.08                  # pre-grasp distance back from the grasp, along the approach
lift_height: 0.10               # how far to lift straight up after grasping

top_grasp_depth: 0.02           # top grasp: finger pads this far below the object's top
tip_clearance: 0.01             # top grasp: keep the fingertips at least this far above the object's bottom
tall_grip_height: 0.06          # side grasp: never grip higher than this above the object's bottom

tall_ratio: 2.0                 # 'auto' picks a side grasp when height > tall_ratio x footprint width
width_margin: 0.015             # skip grasps wider than the full gripper opening minus this
min_width: 0.01                 # skip grasps narrower than this; the closed gripper can't hold them

place_clearance: 0.02           # release with the object's bottom this far above the surface
