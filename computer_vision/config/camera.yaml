# Rig / hardware: changes when the camera or robot setup changes.
vision_snapshot_node:
  ros__parameters:
    base_frame: base_link
    color_topic: /kinect2/sd/image_color_rect
    depth_topic: /kinect2/sd/image_depth_rect
    info_topic: /kinect2/sd/camera_info
    # HD colour for YOLO, if HD not available: '' = uses SD for YOLO
    hd_color_topic: /kinect2/hd/image_color_rect
    hd_info_topic: /kinect2/hd/camera_info

    # Arm self mask. a sphere of arm_radius around each of these TF frames is removed from the cloud.
    arm_frames: ['shoulder_link', 'arm_link', 'forearm_link',
                 'lower_wrist_link', 'upper_wrist_link', 'end_effector_link']
    arm_radius: 0.12

    # Fixed fixtures to ignore (The arm's mount to table)
    #x_min, x_max, y_min, y_max, z_min, z_max.
    exclude_boxes: [-0.09, 0.05, -0.06, 0.06, -0.20, 0.06]