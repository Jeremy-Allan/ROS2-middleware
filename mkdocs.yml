site_name: Kinova Middleware Manual
site_description: User manual and API reference for the Kinova Gen3 Lite ROS 2 middleware and its paired LLM proxy.
repo_url: https://github.com/Jeremy-Allan/ROS2-middleware
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: README.md
  - Overview: overview.md
  - Environment Setup: environment-setup.md
  - Installation: installation.md
  - Running the System: running.md
  - Configuration: configuration.md
  - Testing: testing.md
  - Troubleshooting: troubleshooting.md
  - Architecture: architecture.md
  - Safety and Contracts: safety-and-contracts.md
  - Motion References:
      - Pour: pour-motion-reference.md
      - Push: push-motion-reference.md
      - Throw: throw-motion-reference.md
  - Video Demos: demos.md
  - Middleware API Reference:
      - Nodes: api/nodes.md
      - Actions: api/actions.md
      - Utils: api/utils.md
  - Proxy:
      - Overview: proxy/overview.md
      - API Reference:
          - Backend: proxy/api/backend.md
          - LLM Proxy: proxy/api/llm-proxy.md
          - TUI: proxy/api/tui.md
          - Shared: proxy/api/shared.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # The outer kinova_interface/ is the ROS 2 package directory; the
          # inner kinova_interface/kinova_interface/ is the actual Python
          # package (has __init__.py). Putting the OUTER dir on the path is
          # what makes "kinova_interface.nodes.xyz" resolvable, putting the
          # inner one on the path instead resolves "nodes.xyz" with no
          # top-level package name, which mkdocstrings can't match against
          # "kinova_interface.nodes.xyz" in the docs/api/*.md pages.
          # griffe reads this via static analysis, it does not import or
          # execute the code, so this works in CI without ROS 2 or any of
          # kinova_interface's own runtime dependencies (rclpy, MoveIt
          # messages, etc.) installed.
          paths: [kinova_interface]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            heading_level: 2
            merge_init_into_class: true
