name: Build and deploy docs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily rebuild, so content pulled in from the proxy repo stays
    # reasonably fresh even on days nobody pushes to this repo.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Check out the proxy repo
        uses: actions/checkout@v4
        with:
          repository: paul-isit/embodied-ai-proxy
          path: .proxy-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0

      - name: Pull in the proxy repo's docs and generate its API reference
        run: |
          set -e
          mkdir -p docs/proxy/api
          # The proxy's README is its manual page. Relative links (e.g.
          # run.sh) would be dead on the site, so point them at the repo.
          python3 - <<'PY'
          import re
          src = open(".proxy-src/README.md").read()
          base = "paul-isit/embodied-ai-proxy/main/"
          # Images need the raw file, a /blob/ URL returns GitHub's HTML page.
          src = re.sub(
              r"(!\[[^\]]*\])\((?!https?://|#|mailto:)(?:\./)?([^)\s]+)\)",
              lambda m: f"{m.group(1)}(https://raw.githubusercontent.com/{base}{m.group(2)})",
              src,
          )
          src = re.sub(
              r"\]\((?!https?://|#|mailto:)(?:\./)?([^)\s]+)\)",
              lambda m: f"](https://github.com/{base.replace('/main/', '/blob/main/')}{m.group(1)})",
              src,
          )
          open("docs/proxy/overview.md", "w").write(src)
          PY

          # One combined reference page per Go module. Run from inside
          # each module so its own go.mod (linked via the proxy repo's
          # go.work) resolves correctly.
          for module in backend llm-proxy tui shared; do
            out="$GITHUB_WORKSPACE/docs/proxy/api/${module}.md"
            ( cd ".proxy-src/${module}" && gomarkdoc --output "$out" ./... )
          done

      - name: Build site
        # not --strict: griffe warns on docstring types that have no matching type hint
        run: mkdocs build --site-dir _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
