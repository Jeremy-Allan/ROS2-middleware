<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Grasp approach zones"><title>Grasp approach zones</title><desc>Side view of the approach direction of the gripper. Top grasps approach within 45 degrees of straight down. Side grasps approach from 45 degrees below horizontal to 15 degrees above. Steeper upward approaches are not used.</desc><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#455a64"/></marker></defs><rect x="0.5" y="0.5" width="759" height="299" rx="8" fill="#ffffff" stroke="#dfe2ea"/><path d="M 200 150 L 200.0 270.0 A 120 120 0 0 0 284.9 234.9 Z" fill="#dfe3f8" stroke="#5c6bc0" stroke-width="1.3" /><path d="M 200 150 L 284.9 234.9 A 120 120 0 0 0 315.9 118.9 Z" fill="#d9efe8" stroke="#3a9d82" stroke-width="1.3" /><path d="M 200 150 L 315.9 118.9 A 120 120 0 0 0 200.0 30.0 Z" fill="#f1f2f4" stroke="#9aa3ab" stroke-width="1.3" stroke-dasharray="4 3"/><line x1="160" y1="150" x2="348" y2="150" stroke="#90a4ae" stroke-width="1" stroke-dasharray="2 4"/><rect x="186" y="136" width="28" height="28" rx="3" fill="#ffffff" stroke="#455a64" stroke-width="1.6"/><text x="170" y="180" text-anchor="end" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f">object</text><text x="154" y="144" text-anchor="end" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#37474f">horizontal</text><text x="300.16652224137044" y="250.16652224137044" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#37474f">-45°</text><text x="337.3659123753133" y="118.80060986605719" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#37474f">+15°</text><text x="200" y="290.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#37474f">straight down</text><text x="229.849307724477" y="226.06260353588038" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#2f3d8f">top</text><text x="277.27406610312545" y="174.70552360820164" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#1d6b57">side</text><text x="250.48424097670397" y="89.38311820424879" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6b747c">not used</text><rect x="400" y="76" width="22" height="22" rx="4" fill="#dfe3f8" stroke="#5c6bc0" stroke-width="1.3"/><text x="434" y="92" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#263238">Top grasp</text><text x="434" y="111" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#37474f">Approach within 45° of straight down.</text><rect x="400" y="142" width="22" height="22" rx="4" fill="#d9efe8" stroke="#3a9d82" stroke-width="1.3"/><text x="434" y="158" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#263238">Side grasp</text><text x="434" y="177" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#37474f">Approach from 45° below horizontal to 15° above.</text><rect x="400" y="208" width="22" height="22" rx="4" fill="#f1f2f4" stroke="#9aa3ab" stroke-width="1.3"/><text x="434" y="224" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#263238">Not used</text><text x="434" y="243" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#37474f">Approach more than 15° upward, from below.</text><text x="400" y="28" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5f6b8a">Approach direction of the gripper, side view</text><text x="400" y="46" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f">The zones apply to every heading around the object.</text></svg>
