<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 566" width="800" height="566" role="img" aria-label="Control path from the middleware to the arm"><title>Control path from the middleware to the arm</title><desc>kinova_hardware_client sends planning and execution goals to move_group and gripper goals to the gripper controller. move_group sends trajectories to joint_trajectory_controller. The controllers exchange commands and states with the hardware interface, which is the Kortex driver for a real arm or the mock hardware for simulation.</desc><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#455a64"/></marker></defs><rect x="0.5" y="0.5" width="799" height="565" rx="8" fill="#ffffff" stroke="#dfe2ea"/><rect x="270" y="14" width="260" height="40" rx="5" fill="#e8f5f1" stroke="#3a9d82" stroke-width="1.4"/><text x="400.0" y="38.5" text-anchor="middle" font-family="'Roboto Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5" fill="#10332a">kinova_hardware_client</text><rect x="40" y="100" width="340" height="84" rx="8" fill="#fafbff" stroke="#aab2dd" stroke-width="1.2" stroke-dasharray="5 4"/><text x="52" y="118" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5f6b8a" letter-spacing="0.3">MoveIt 2</text><rect x="120" y="134" width="180" height="38" rx="5" fill="#f3f4f6" stroke="#78909c" stroke-width="1.4"/><text x="210.0" y="157.5" text-anchor="middle" font-family="'Roboto Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5" fill="#263238">move_group</text><rect x="40" y="236" width="720" height="104" rx="8" fill="#fafbff" stroke="#aab2dd" stroke-width="1.2" stroke-dasharray="5 4"/><text x="52" y="254" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5f6b8a" letter-spacing="0.3">ros2_control</text><rect x="95" y="270" width="230" height="40" rx="5" fill="#e8f5f1" stroke="#3a9d82" stroke-width="1.4"/><text x="210.0" y="294.5" text-anchor="middle" font-family="'Roboto Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5" fill="#10332a">joint_trajectory_controller</text><rect x="455" y="270" width="262" height="40" rx="5" fill="#e8f5f1" stroke="#3a9d82" stroke-width="1.4"/><text x="586.0" y="294.5" text-anchor="middle" font-family="'Roboto Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5" fill="#10332a">gen3_lite_2f_gripper_controller</text><rect x="40" y="372" width="720" height="98" rx="8" fill="#fafbff" stroke="#aab2dd" stroke-width="1.2" stroke-dasharray="5 4"/><text x="52" y="390" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5f6b8a" letter-spacing="0.3">Hardware interface</text><rect x="60" y="404" width="350" height="48" rx="5" fill="#f3f4f6" stroke="#78909c" stroke-width="1.4"/><text x="235.0" y="425.0" text-anchor="middle" font-family="'Roboto Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5" fill="#263238">kortex_driver/KortexMultiInterfaceHardware</text><text x="235.0" y="441.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#37474f">use_fake_hardware:=false</text><rect x="450" y="404" width="250" height="48" rx="5" fill="#f3f4f6" stroke="#78909c" stroke-width="1.4"/><text x="575.0" y="425.0" text-anchor="middle" font-family="'Roboto Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5" fill="#263238">mock_components/GenericSystem</text><text x="575.0" y="441.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#37474f">use_fake_hardware:=true</text><rect x="100" y="502" width="250" height="46" rx="5" fill="#fff4e5" stroke="#ef9a3c" stroke-width="1.4"/><text x="225.0" y="522.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#3e2a05">Kinova Gen3 Lite</text><text x="225.0" y="538.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#37474f">at robot_ip</text><path d="M 270 34 L 210 34 L 210 134" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><text x="198" y="62.0" text-anchor="end" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">move_action,</text><text x="198" y="75.5" text-anchor="end" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">execute_trajectory</text><path d="M 530 34 L 586 34 L 586 270" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><text x="598" y="150.0" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">gripper_cmd</text><path d="M 210 172 L 210 270" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><text x="222" y="224.0" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">follow_joint_trajectory</text><path d="M 210 310 L 210 372" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" marker-start="url(#head)" stroke-linejoin="round"/><text x="222" y="352.0" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">position commands</text><text x="222" y="365.5" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">position and velocity states</text><path d="M 586 310 L 586 372" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" marker-start="url(#head)" stroke-linejoin="round"/><path d="M 235 452 L 235 502" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" marker-start="url(#head)" stroke-linejoin="round"/><text x="247" y="480.0" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">Kortex API</text><text x="247" y="493.5" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">TCP 10000, UDP 10001</text></svg>
