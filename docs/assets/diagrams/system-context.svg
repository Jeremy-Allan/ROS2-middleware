<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 762 296" width="762" height="296" role="img" aria-label="System context"><title>System context</title><desc>An operator types into the terminal UI. The backend asks an LLM provider for a recipe and sends it over a websocket to the ROS 2 nodes, which plan with MoveIt 2 and drive the arm through the Kortex driver.</desc><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#455a64"/></marker></defs><rect x="0.5" y="0.5" width="761" height="295" rx="8" fill="#ffffff" stroke="#dfe2ea"/><rect x="18" y="12" width="118" height="34" rx="17.0" fill="#f3f4f6" stroke="#78909c" stroke-width="1.4"/><text x="77.0" y="33.5" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#263238">Operator</text><rect x="10" y="60" width="456" height="98" rx="8" fill="#fafbff" stroke="#aab2dd" stroke-width="1.2" stroke-dasharray="5 4"/><text x="22" y="149" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5f6b8a" letter-spacing="0.3">embodied-ai-proxy</text><rect x="18" y="92" width="118" height="46" rx="5" fill="#eef0fb" stroke="#5c6bc0" stroke-width="1.4"/><text x="77.0" y="112.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1a1f36">Terminal UI</text><text x="77.0" y="128.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#37474f">instructions, status</text><rect x="170" y="92" width="118" height="46" rx="5" fill="#eef0fb" stroke="#5c6bc0" stroke-width="1.4"/><text x="229.0" y="112.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1a1f36">Backend</text><text x="229.0" y="128.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#37474f">prompt, validation</text><rect x="322" y="92" width="118" height="46" rx="5" fill="#eef0fb" stroke="#5c6bc0" stroke-width="1.4"/><text x="381.0" y="112.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1a1f36">LLM proxy</text><text x="381.0" y="128.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#37474f">provider adapters</text><rect x="474" y="92" width="118" height="46" rx="5" fill="#f3f4f6" stroke="#78909c" stroke-width="1.4"/><text x="533.0" y="112.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#263238">LLM provider</text><text x="533.0" y="128.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#37474f">Ollama or cloud API</text><rect x="162" y="192" width="134" height="92" rx="8" fill="#fafbff" stroke="#aab2dd" stroke-width="1.2" stroke-dasharray="5 4"/><text x="174" y="275" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5f6b8a" letter-spacing="0.3">ROS2-middleware</text><rect x="170" y="208" width="118" height="46" rx="5" fill="#e8f5f1" stroke="#3a9d82" stroke-width="1.4"/><text x="229.0" y="228.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#10332a">ROS 2 nodes</text><text x="229.0" y="244.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#37474f">four nodes</text><rect x="322" y="208" width="118" height="46" rx="5" fill="#f3f4f6" stroke="#78909c" stroke-width="1.4"/><text x="381.0" y="228.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#263238">MoveIt 2</text><text x="381.0" y="244.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#37474f">planning, collisions</text><rect x="474" y="208" width="118" height="46" rx="5" fill="#f3f4f6" stroke="#78909c" stroke-width="1.4"/><text x="533.0" y="228.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#263238">Kortex driver</text><text x="533.0" y="244.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#37474f">ros2_control</text><rect x="626" y="208" width="118" height="46" rx="5" fill="#fff4e5" stroke="#ef9a3c" stroke-width="1.4"/><text x="685.0" y="228.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#3e2a05">Gen3 Lite arm</text><text x="685.0" y="244.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#37474f">arm and gripper</text><path d="M 77 46 L 77 92" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><path d="M 136 115 L 170 115" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" marker-start="url(#head)" stroke-linejoin="round"/><path d="M 288 115 L 322 115" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" marker-start="url(#head)" stroke-linejoin="round"/><path d="M 440 115 L 474 115" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" marker-start="url(#head)" stroke-linejoin="round"/><path d="M 229 138 L 229 208" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" marker-start="url(#head)" stroke-linejoin="round"/><text x="240" y="178.0" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">websocket (rosbridge)</text><path d="M 288 231 L 322 231" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><path d="M 440 231 L 474 231" fill="none" stroke="#455a64"