<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Status and fault flow"><title>Status and fault flow</title><desc>Three nodes publish heartbeats on /status/node_report. telemetry_node publishes /system/status and talks to the fault controller.</desc><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#455a64"/></marker></defs><rect x="0.5" y="0.5" width="799" height="299" rx="8" fill="#ffffff" stroke="#dfe2ea"/><rect x="14" y="14" width="206" height="38" rx="5" fill="#e8f5f1" stroke="#3a9d82" stroke-width="1.4"/><text x="117.0" y="37.5" text-anchor="middle" font-family="'Roboto Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5" fill="#10332a">json_parser_node</text><rect x="14" y="74" width="206" height="38" rx="5" fill="#e8f5f1" stroke="#3a9d82" stroke-width="1.4"/><text x="117.0" y="97.5" text-anchor="middle" font-family="'Roboto Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5" fill="#10332a">environment_mapping_node</text><rect x="14" y="134" width="206" height="38" rx="5" fill="#e8f5f1" stroke="#3a9d82" stroke-width="1.4"/><text x="117.0" y="157.5" text-anchor="middle" font-family="'Roboto Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5" fill="#10332a">kinova_hardware_client</text><rect x="14" y="236" width="206" height="38" rx="5" fill="#f3f4f6" stroke="#78909c" stroke-width="1.4"/><text x="117.0" y="259.5" text-anchor="middle" font-family="'Roboto Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5" fill="#263238">fault_controller</text><rect x="380" y="76" width="150" height="44" rx="5" fill="#e8f5f1" stroke="#3a9d82" stroke-width="1.4"/><text x="455.0" y="102.5" text-anchor="middle" font-family="'Roboto Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5" fill="#10332a">telemetry_node</text><rect x="640" y="76" width="146" height="44" rx="5" fill="#f3f4f6" stroke="#78909c" stroke-width="1.4"/><text x="713.0" y="102.5" text-anchor="middle" font-family="'Roboto Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5" fill="#263238">rosbridge_server</text><path d="M 220 33 L 300 33 L 300 98 L 380 98" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><path d="M 220 93 L 300 93 L 300 98 L 380 98" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><path d="M 220 153 L 300 153 L 300 98 L 380 98" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><text x="308" y="62" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f">/status/node_report</text><path d="M 530 98 L 640 98" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><text x="585" y="90.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">/system/status</text><path d="M 117 236 L 117 172" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><text x="127" y="208.0" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">/fault_controller/is_faulted</text><path d="M 455 120 L 455 255 L 220 255" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" marker-start="url(#head)" stroke-linejoin="round"/><text x="465" y="205.0" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">reset_fault, configure and</text><text x="465" y="218.5" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">activate controller</text></svg>
