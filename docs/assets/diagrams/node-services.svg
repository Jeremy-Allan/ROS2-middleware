<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" width="800" height="392" role="img" aria-label="Services and actions between the middleware nodes"><title>Services and actions between the middleware nodes</title><desc>rosbridge_server calls json_parser_node. json_parser_node calls environment_mapping_node, kinova_hardware_client and MoveIt 2. kinova_hardware_client calls MoveIt 2 and the gripper controller. environment_mapping_node updates MoveIt's planning scene.</desc><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#455a64"/></marker></defs><rect x="0.5" y="0.5" width="799" height="391" rx="8" fill="#ffffff" stroke="#dfe2ea"/><rect x="315" y="14" width="150" height="38" rx="5" fill="#f3f4f6" stroke="#78909c" stroke-width="1.4"/><text x="390.0" y="37.5" text-anchor="middle" font-family="'Roboto Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5" fill="#263238">rosbridge_server</text><rect x="315" y="100" width="150" height="38" rx="5" fill="#e8f5f1" stroke="#3a9d82" stroke-width="1.4"/><text x="390.0" y="123.5" text-anchor="middle" font-family="'Roboto Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5" fill="#10332a">json_parser_node</text><rect x="14" y="214" width="206" height="40" rx="5" fill="#e8f5f1" stroke="#3a9d82" stroke-width="1.4"/><text x="117.0" y="238.5" text-anchor="middle" font-family="'Roboto Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5" fill="#10332a">environment_mapping_node</text><rect x="430" y="214" width="190" height="40" rx="5" fill="#e8f5f1" stroke="#3a9d82" stroke-width="1.4"/><text x="525.0" y="238.5" text-anchor="middle" font-family="'Roboto Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5" fill="#10332a">kinova_hardware_client</text><rect x="690" y="212" width="96" height="44" rx="5" fill="#f3f4f6" stroke="#78909c" stroke-width="1.4"/><text x="738.0" y="231.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#263238">Gripper</text><text x="738.0" y="247.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#37474f">controller</text><rect x="315" y="332" width="150" height="40" rx="5" fill="#f3f4f6" stroke="#78909c" stroke-width="1.4"/><text x="390.0" y="356.5" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#263238">MoveIt 2</text><path d="M 390 52 L 390 100" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><text x="402" y="73.0" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">/execute_recipe</text><text x="402" y="86.5" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">/reset_environment</text><path d="M 350 138 L 350 170 L 117 170 L 117 214" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><text x="232" y="164.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">object and scene services</text><path d="M 440 138 L 440 170 L 525 170 L 525 214" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><text x="535" y="196.0" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">motion and gripper services</text><path d="M 390 138 L 390 332" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><text x="382" y="262.0" text-anchor="end" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">planning, IK, FK,</text><text x="382" y="275.5" text-anchor="end" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">validity services</text><path d="M 117 254 L 117 352 L 315 352" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><text x="216" y="346.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">/apply_planning_scene</text><path d="M 525 254 L 525 352 L 465 352" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><text x="535" y="300.0" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">move_action,</text><text x="535" y="313.5" text-anchor="start" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">execute_trajectory</text><path d="M 620 234 L 690 234" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#head)" stroke-linejoin="round"/><text x="655" y="225.0" text-anchor="middle" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#37474f" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">gripper_cmd</text></svg>
